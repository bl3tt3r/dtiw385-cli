[package]
name = "dtiw385-cli"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "dtiw385"
path = "src/main.rs"

[dependencies]
thiserror = "2"
clap = { version = "4.6.0", features = ["derive"] }
dtiw385 = "0.1.1"
serde = "1.0.228"
tokio = { version = "1.51.1", features = [
    "rt-multi-thread",
    "macros",
    "io-std",
    "io-util",
] }
serde_json = "1.0.149"
