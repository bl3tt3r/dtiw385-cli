[package]
name = "dtiw385-cli"
version = "0.1.0"
edition = "2024"
description = "CLI to interact with DTIW385 decoders"

[[bin]]
name = "dtiw385"
path = "src/main.rs"

[dependencies]
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dtiw385 = { version = "0.1.2", features = ["serializable"] }
tokio = { version = "1.51.1", features = [
    "rt-multi-thread",
    "macros",
    "io-std",
    "io-util",
] }
clap = { version = "4", features = ["derive"] }
