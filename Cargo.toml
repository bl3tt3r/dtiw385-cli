[package]
name = "dtiw385-cli"
version = "0.1.0"
edition = "2024"
description = "CLI to interact with dtiw385 decoders"
license = "MIT"

repository = "https://github.com/bl3tt3r/dtiw385-cli"
readme = "readme.md"
keywords = ["orange", "decoder", "tv", "remote-control", "network"]
categories = [
    "command-line-utilities",
    "api-bindings",
    "hardware-support",
    "network-programming",
]

[[bin]]
name = "dtiw385"
path = "src/main.rs"

[dependencies]
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dtiw385 = { version = "0.1.2", features = ["serializable"] }
tokio = { version = "1.51.1", features = [
    "rt",      # runtime de base (suffit avec current_thread)
    "macros",  # pour #[tokio::main]
    "io-std",  # pour tokio::io::stdin()
    "io-util", # pour BufReader / AsyncBufReadExt
] }
clap = { version = "4", features = ["derive"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
